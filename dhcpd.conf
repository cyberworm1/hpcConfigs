# Global options for sync
option domain-name "internal";
option domain-search "internal";
option domain-name-servers 192.168.100.2, 192.168.100.3;
option ntp-servers 192.168.100.5;  # seiko.internal
default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

# Subnet declaration
subnet 192.168.100.0 netmask 255.255.255.0 {
  option routers 192.168.100.1;  # Assumed gateway; adjust if no external route needed
  option broadcast-address 192.168.100.255;
  pool {
    range 192.168.100.20 192.168.100.29;  # Dynamic pool
  }
}

# Static reservations (placeholders - update MACs post-VM spin-up)
host slave000 {
  hardware ethernet 00:00:00:00:00:20;  # Dummy
  fixed-address 192.168.100.20;
}
host slave001 {
  hardware ethernet 00:00:00:00:00:21;
  fixed-address 192.168.100.21;
}
host slave002 {
  hardware ethernet 00:00:00:00:00:22;
  fixed-address 192.168.100.22;
}
host slave003 {
  hardware ethernet 00:00:00:00:00:23;
  fixed-address 192.168.100.23;
}
